appId: local.chatgpt-tabs.desktop
productName: ChatGPT Tabs
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/*.map"
asar: true
extraResources:
  - from: LICENSE
    to: LICENSE
npmRebuild: false
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: ChatGPT voice conversations need access to the microphone.
    NSCameraUsageDescription: ChatGPT video features need access to the camera.
dmg:
  artifactName: ChatGPT-Tabs-${version}-mac-${arch}.${ext}
  writeUpdateInfo: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: ChatGPT-Tabs-${version}-win-${arch}-portable.${ext}
nsis:
  artifactName: ChatGPT-Tabs-${version}-win-${arch}-setup.${ext}
  license: LICENSE
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ChatGPT Tabs
  deleteAppDataOnUninstall: false
linux:
  target: AppImage
  category: Utility
  artifactName: ChatGPT-Tabs-${version}-linux-${arch}.${ext}
publish: null
